[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yerevan-business-finder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2", "celery>=5.4,<6", "redis>=5,<7", "httpx>=0.27,<0.29", "httpcore>=1.0.9,<1.1", "beautifulsoup4>=4.12,<5", "phonenumbers>=8.13,<10", "pydantic-settings>=2.6,<3", "jinja2>=3.1,<4", "python-multipart>=0.0.18,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
